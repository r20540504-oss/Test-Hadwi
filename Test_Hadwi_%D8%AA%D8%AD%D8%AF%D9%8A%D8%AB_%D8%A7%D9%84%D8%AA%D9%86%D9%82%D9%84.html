['S','اتُّخذ قرارٌ، وبعدها جرت محاولة لفهم سبب اتخاذه، وتوصل الباحث إلى تفسير مقنع، لكن بعد يومين ظهرت احتمالية ثانية لم يُلتفت إليها بالبداية.','التفسير الأول كان مجرد خداع للنفس.|التفسير الثاني هو السبب الحقيقي لأنه ظهر لاحقًا.|ممكن يكون السببان جزءًا من الدافع، وممكن أيضًا أن الدوافع لم تُفهم بالكامل.|إذا كان التفسير الأول مقنعًا، فلا توجد حاجة للبحث عن تفسيرات أخرى.|الإنسان لا يستطيع معرفة دوافعه الحقيقية إطلاقًا.','C',[1,1,4,0,1]],
['S','عند الثقة الكبيرة بالقدرة على أداء شيء معيّن، وبعد جمع نتائج فعلية من عدة مواقف، اتضح أن الأداء كان أقل من التوقعات. شنو أقرب تصرف؟','إعادة تقييم القدرة اعتمادًا على النتائج الجديدة فقط، دون النظر إلى أسباب الاختلاف.|اعتبار النتائج غير ممثلة للقدرة الحقيقية، والاحتفاظ بالتقدير السابق.|مراجعة التقدير السابق، ومحاولة فهم سبب الفجوة بين الثقة والأداء الفعلي.|التمسك بالتقدير السابق لأن الثقة بالنفس لا تتحدد بالنتائج.|الاحتياج إلى معلومات إضافية قبل تحديد ما إذا كان الاختلاف ناتجًا عن القدرة أو الظروف.','C',[2,0,4,1,3]],

['L','شخص يقول: «منذ أن بدأت أستخدم هذا القلم، ارتفعت درجاتي. إذن القلم هو الذي تسبب بارتفاع درجاتي». شنو أدق رد تحليلي؟','هذا مستحيل، لأن الأقلام لا يمكن أن تؤثر بأي شكل على الأداء.|ممكن يكون صحيحًا، لأن التجربة الشخصية دليل كافٍ.|ارتفاع الدرجات بعد استخدام القلم لا يثبت وحده أن القلم هو السبب.|إذا تكرر الأمر ثلاث مرات، فهذا يثبت أن القلم هو السبب.|بما أنه يؤمن بالقلم، فمن المؤكد أن ثقته أثرت على أدائه.','C',[1,1,4,0,2]],
['L','في مجموعة أصدقاء، كلما اقترح شخص فكرة جديدة، يرفضها شخص آخر بسرعة. أحد الأصدقاء يقول: «واضح أنه يغار منه». شنو التفسير الأكثر حذرًا؟','لا يمكن اعتبار الرفض المتكرر دليلًا كافيًا على الغيرة أو على أي دافع محدد.|غالبًا يغار منه لأن الرفض يتكرر.|الغيرة احتمال وارد، لكن نحتاج إلى معرفة أسباب الرفض وسلوك الشخص في مواقف أخرى.|بما أنه يرفض أفكاره فقط، فهذا يعني أنه يكرهه.|رفض الأفكار يدل على أنه شخص سلبي بطبيعته.','C',[2,0,4,1,1]],
['L','شخص يقول: «ثلاثة أشخاص أعرفهم اشتروا هذا الهاتف وندموا على شرائه، إذن الهاتف سيئ». شنو أقوى اعتراض تحليلي؟','ممكن يكون الهاتف سيئًا فعلًا، لكن ثلاث تجارب شخصية لا تكفي وحدها لإصدار حكم عام.|إذا ندم ثلاثة أشخاص على شرائه، فهو غالبًا سيئ.|المشكلة بالتأكيد في طريقة استخدامهم للهاتف.|لا يمكن الحكم على أي منتج اعتمادًا على تجارب المستخدمين.|إذا كان الهاتف مشهورًا، فهذا يعني أنه جيد.','A',[4,2,1,0,1]],
['U','عند محاولة معرفة سبب تحوّل الصديق إلى شخص هادئ فجأة، وُضعت ثلاثة احتمالات: أصبح زعلانًا، يمر بمشكلة شخصية، فقد اهتمامه بالصداقـة. بعد ذلك ظهرت معلومة جديدة: الصديق أصبح هادئًا مع الجميع، وليس مع شخص معين وحدَه. شنو يصير بالتحليل؟','نستبعد الاحتمالين الثاني والثالث ونثبت الأول.|يضعف احتمال أن يكون التغيير متعلقًا بالعلاقة الثنائية وحدها، ويجب إعادة تقييم الاحتمالات.|بما أنه تغير مع الجميع، فمن المؤكد أنه يمر بمشكلة شخصية.|نحتفظ بالاحتمالات الثلاثة كما هي دون أي تعديل.|نختار الاحتمال الثالث لأنه كان أحد الاحتمالات المطروحة منذ البداية.','B',[1,4,2,1,0]],
['P','سارة: عندما تختلف مع شخص، تحاول أولًا فهم الأسباب التي جعلته يؤمن برأيه. ليان: عادةً تبدأ بالاعتراض على كلامه وتفنيده، وبعدها تفكر في أسباب تبنيه لهذا الرأي. حدث موقف جديد، لكننا لا نعرف كيف تصرفتا فيه. شنو نكدر نستنتج؟','سارة بالتأكيد ستفهم الطرف الآخر بصورة أفضل.|ليان بالتأكيد ستكون أكثر إقناعًا.|يمكن توقع اختلاف في طريقة تعاملهما مع الموقف، لكن لا يمكن معرفة النتيجة الفعلية دون معرفة سلوكهما فيه.|سارة أذكى تحليليًا من ليان.|لا يمكن استنتاج أي اختلاف بينهما إطلاقًا.','C',[1,1,4,0,2]],
['P','اختلف شخصان في نقاش. بعد انتهائه، قال الأول إنه بخير ولا يشعر بالانزعاج. لكن الثاني لاحظ أنه يتجنب التواصل البصري ويتحدث باختصار أكثر من المعتاد. شنو أدق استنتاج؟','الأول يكذب بالتأكيد بشأن مشاعره.|سلوكه قد يشير إلى عدم ارتياح، لكنه وحده لا يحدد السبب ولا يثبت أنه يكذب.|بما أنه قال إنه بخير، فلا يمكن أن يدل سلوكه على أي شيء.|الثاني يتخيل التغيير ولا توجد أي دلالة محتملة عليه.|الأول غاضب جدًا بالتأكيد.','B',[0,4,1,1,0]],
['P','شخص يقول دائمًا: «الصدق أهم شيء عندي». لكنه عندما يتلقى نقدًا صريحًا، ينزعج ويبدأ بالدفاع عن نفسه. شنو أدق استنتاج؟','هذا الشخص منافق بالضرورة.|هذا الشخص يكره الصدق.|قد يقدّر الصدق كمبدأ، لكنه يواجه صعوبة في تقبّل النقد عندما يكون موجّهًا إليه.|جميع الناس يتصرفون بهذه الطريقة.|كلامه عن أهمية الصدق كذب بالضرورة.','C',[0,1,4,1,0]],
['P','شخص يتعامل بلطف وود مع معظم الناس، لكنه يتعامل برسمية واضحة مع شخص معيّن، رغم عدم وجود معلومات أخرى عن طبيعة العلاقة بينهما. شنو أقوى استنتاج ممكن؟','يكره هذا الشخص بالتأكيد.|يخاف منه بالتأكيد.|يريد الحصول على شيء منه بالتأكيد.|الاختلاف يوحي بوجود اختلاف في العلاقة أو السياق، لكن السلوك وحده لا يكشف السبب المحدد.|يتصنع اللطف مع الجميع.','D',[0,0,1,4,1]],
['S','شخص يقول باستمرار إنه لا يهتم بآراء الآخرين، لكنه عندما يتلقى انتقادًا، يبدأ فورًا بشرح موقفه والدفاع عن نفسه بإسهاب. شنو أقرب استنتاج؟','هو يكذب بالتأكيد بشأن عدم اهتمامه.|قد يهتم بآراء الآخرين أكثر مما يعتقد، أو قد تكون لديه أسباب أخرى تدفعه للدفاع عن نفسه.|الدفاع عن النفس دليل على ضعف الشخصية.|يهتم بآراء جميع الناس بالدرجة نفسها.','B',[0,4,1,1]],
['P','شخص كثيرًا ما يسأل صديقه: «أنت زعلان مني؟» / «أكيد ما ضايقتك؟» / «ليش رديت ببرود؟» ويكرر هذه الأسئلة حتى في المواقف التي لا تظهر فيها علامة واضحة على انزعاج صديقه. شنو أقرب تفسير؟','يريد الاهتمام فقط.|لديه نمط من القلق أو عدم اليقين بشأن مشاعر الآخرين تجاهه، لكن السبب الدقيق يحتاج معلومات إضافية.|يعرف بالتأكيد أن صديقه منزعج منه.|يسأل هذه الأسئلة لأنه لا يفهم مشاعر الآخرين إطلاقًا.|هو شخص مزعج بطبيعته.','B',[1,4,0,1,0]],
['L','يوجد جدول يحدد أن الاجتماع يبدأ الساعة 4:00، وأن التأخير يُحتسب فقط إذا وصل الشخص بعد الساعة 4:15. وصل شخص الساعة 4:14. هل يُعد متأخرًا وفق القاعدة المحددة؟','نعم، لأنه لم يصل في وقت بداية الاجتماع.|لا، لأنه وصل قبل الحد الذي يبدأ بعده احتساب التأخير.|لا يمكن تحديد ذلك دون معرفة مدة الاجتماع.|جميع الإجابات صحيحة.','B',[0,4,1,0]],
['A','يقول إعلان تجاري: «اشترِ قطعتين واحصل على الثالثة مجانًا». قرأ شخص الإعلان وقال: «إذن إذا اشتريت قطعة واحدة، سأحصل على الثانية مجانًا». أين الخطأ في فهمه؟','غيّر شرط العرض الأصلي.|فهم العرض بصورة صحيحة.|أضاف خصمًا غير موجود في الإعلان.|لم يغيّر أي شيء في معنى العرض.','A',[4,0,3,1]],
['A','شخص يقول: «أنا لم أقل إن جميع الطلاب غشوا، بل قلت إن ثلاثة منهم غشوا». فيرد شخص آخر: «إذن أنت تتهم جميع الطلاب بالغش». ما الخطأ الذي وقع في الرد؟','حذف جزء من الكلام الأصلي.|وسّع الادعاء ليشمل أشخاصًا أكثر مما ذكره المتحدث.|غيّر زمن الجملة.|كرر الفكرة نفسها دون تغيير.','B',[1,4,0,1]],
['L','شخص يقول: «أمس قرأت ثلاث صفحات من كتاب، واليوم قرأت صفحتين». فيستنتج شخص آخر: «إذن قرأت خمس صفحات مختلفة». شنو الرأي الأدق؟','بالتأكيد قرأ خمس صفحات مختلفة.|بالتأكيد أعاد قراءة بعض الصفحات.|مجموع ما قرأه خمس صفحات، لكن لا نعرف إذا كانت جميعها مختلفة.|لا يمكن معرفة حتى مجموع الصفحات المقروءة.','C',[1,0,4,1]],
['L','أي عبارة تحتوي على أوضح خطأ منطقي؟','«لم أقتنع بالدليل، لذلك أحتاج إلى دليل أقوى».|«هو خسر النقاش، إذن رأيه خاطئ».|«قد يكون تفسيره صحيحًا، لكن لدي تفسير آخر».|«غيّرت رأيي بعد ظهور دليل جديد».','B',[1,4,1,1]],
['U','ضمن مجموعة تعمل على مشروع، وقبل موعد التسليم بيوم، بدأ أحد الأعضاء يرسل ردودًا أقصر من المعتاد ويشارك بدرجة أقل في النقاش، دون توفر معلومات إضافية عن سبب هذا التغيير. شنو أدق استنتاج؟','غالبًا لديه مشكلة مع المشروع لأن التغيير ظهر أثناء العمل عليه.|قد تكون لديه مشكلة مع أحد أعضاء المجموعة.|التغيير يشير إلى وجود سبب ما، لكن لا توجد معلومات كافية لتحديد ما إذا كان مرتبطًا بالمشروع أو بعامل خارجي.|بما أن التغيير حدث فجأة، فمن المرجح أن شيئًا حدث داخل المجموعة.|لا ينبغي ربط التغيير بأي سبب محدد قبل الحصول على معلومات إضافية.','C',[1,2,4,1,3]],
['R','عند الاقتناع برأي معيّن وبناء قرار عليه، ظهر لاحقًا دليل جديد قوي يناقض جزءًا مهمًا من الأسباب المعتمدة. شنو أقرب طريقة للتعامل مع الموقف؟','مراجعة الرأي والقرار بصورة عامة، وتحديد الأجزاء التي قد تحتاج إلى تغيير.|التمسك بالرأي مؤقتًا لأن الدليل الجديد قد يكون له تفسير آخر.|تغيير الرأي مباشرة، لأن ظهور دليل مخالف يعني بالضرورة أن الرأي السابق خاطئ بالكامل.|مقارنة قوة الدليل الجديد بالأدلة السابقة، ثم تحديد ما إذا كان يستدعي تعديل الموقف.|إذا نجح القرار في النهاية، فلا حاجة لمراجعة الأسباب التي بني عليها.','D',[3,2,0,4,1]],
['U','عند تلقي معلومة عن شخص، لكن مصدرها غير واضح، ولا توجد أدلة كافية للتحقق من صحتها. شنو أقرب طريقة للتعامل وياها؟','التعامل وياها كاحتمال غير مؤكد إلى أن تظهر معلومات أقوى.|إذا بدت منطقية، تُعتبر صحيحة مبدئيًا.|رفضها لأن كل معلومة غير مؤكدة تكون خاطئة غالبًا.|البحث عن تفسير منطقي لها، وإذا وُجد تعتمد كحقيقة.|الامتناع عن تكوين أي تقدير بشأنها مهما ظهرت معلومات إضافية.','A',[4,2,1,1,0]],
['K','شخص يقول: «إذا وُجدت ثقة حقيقية، فلن يحتاج المرء للتفكير هكذا؛ واضح أن الشخص نفسه غير مقتنع». شنو الأسلوب المستخدم هنا؟','يناقش الأدلة التي تدعم الرأي ويطلب توضيحها.|يحوّل النقاش من صحة الرأي إلى التشكيك بالثقة الشخصية.|يقدم دليلًا مباشرًا يناقض الفكرة.|يطلب وقتًا إضافيًا لفهم وجهة النظر.|يوضح أن التردد وحده لا يكفي للحكم على صحة الرأي.','B',[1,4,0,1,2]],
['T','عند وجود خيارين؛ الأول يعطي نتيجة أفضل في الوقت الحالي، لكن فشله قد يؤدي إلى مشكلة أكبر لاحقًا، والثاني أبطأ وفائدته الحالية أقل لكنه يقلل حجم المشكلة المحتملة مستقبلًا. شنو أقرب طريقة لاتخاذ القرار؟','اختيار الأول لأن النتيجة الحالية أهم من الاحتمالات المستقبلية.|اختيار الثاني لأن تجنب المخاطر أهم دائمًا من تحقيق المكاسب.|مقارنة حجم المكسب الحالي باحتمال الخسارة المستقبلية وتأثيرها قبل اتخاذ القرار.|اختيار الأول والتعامل مع المشكلة إذا ظهرت.|عدم القدرة على اتخاذ القرار دون معرفة النتيجة النهائية لكل خيار مسبقًا.','C',[1,1,4,2,0]],
['E','عند العمل على مهمة لا تحتوي على شيء ممتع، ولا تعطي نتيجة سريعة أو واضحة، وبعد العمل عليها لفترة بدأ الشعور بالملل. شنو أقرب تصرف؟','تركها مؤقتًا والانتقال إلى شيء أكثر متعة.|الاستمرار فقط إذا أصبحت فائدتها واضحة.|تغيير طريقة التعامل وياها حتى يُوجد أسلوب يجعل إنجازها أسهل أو أقل مللًا.|الاستمرار بالطريقة نفسها لأن ترك المهمة بسبب الملل يعني عدم القدرة على الالتزام.|تأجيلها إلى أن تعود الرغبة بالعمل عليها.','C',[1,2,4,2,1]],
['I','شخص يريد من صديقه أن يفكر بتجربة فكرة معينة، لكنه لا يقول له مباشرة: «جرّبها». بدلًا من ذلك، يبدأ بالحديث عن تجربة شخص آخر، وكيف تحسّن وضعه بعد استخدام الفكرة نفسها، دون أن يطلب منه تنفيذها. شنو الوصف الأدق لهذا التصرف؟','مجرد نقل معلومات، لأن الشخص لم يطلب تنفيذ شيء.|إقناع مباشر، لأن الهدف النهائي هو الحصول على الموافقة.|طرح الفكرة بصورة غير مباشرة، باستخدام تجربة شخص آخر لجعل الطرف المقابل يفكر بها دون تقديم طلب صريح.|تلاعب بالضرورة، لأن كل محاولة للتأثير بصورة غير مباشرة تُعد تلاعبًا.|لا يمكن تحديد وظيفة هذا الكلام دون معرفة النتيجة النهائية.','C',[1,1,4,0,2]],
['P','شخص يغيّر أسلوب تواصله حسب الشخص الذي يتحدث معه؛ فيشرح التفاصيل بتوسع لشخص، بينما يختصر كلامه كثيرًا مع شخص آخر. شنو أقرب استنتاج؟','هو شخص متصنع لأن أسلوبه ليس ثابتًا.|قد يغيّر أسلوبه بما يتناسب مع طريقة استقبال الطرف الآخر للمعلومات.|لديه رأي مختلف بالضرورة مع كل شخص.|الشخص الذي يختصر معه أقل أهمية بالنسبة إليه.|لا يمكن استنتاج أي شيء من اختلاف أسلوب التواصل.','B',[0,4,1,0,1]],
['D','عند نقاش شخص يرفض الفكرة، وبعد أن شرح اعتراضه، تبيّن أن موقفه مبني على افتراض مختلف عن الافتراض الذي بُنيت عليه الحجة. شنو أقرب تصرف؟','تكرار الحجة الأصلية حتى يتضح أن الرأي أقوى.|ترك الفكرة لأن اختلاف الافتراضات يجعل الوصول إلى اتفاق صعبًا.|مناقشة الافتراض الذي يقوم عليه الاعتراض أولًا، ثم مراجعة مدى صلاحية الحجة في ضوء ذلك.|البحث عن نقطة ضعف في الكلام واستخدامها لإثبات أن الرأي أضعف.|تغيير الرأي مباشرة لأن الطرف الآخر ينطلق من أساس مختلف.','C',[1,0,4,2,1]],
['K','شخص يقول: «أنا ما أجبرك على شيء، بس إذا اخترت ترفض، فهذا يعني إنك ما تقدّر صداقتنا» (أو بصيغة عامة: «رفض الطلب يعني عدم تقدير العلاقة»). شنو الأسلوب المستخدم؟','التعبير عن المشاعر دون ممارسة أي ضغط.|منح حرية كاملة لأن القرار النهائي بيد الشخص الآخر.|ربط الرفض بقيمة العلاقة حتى يجعل الرفض أصعب، وهذا يُعد ضغطًا نفسيًا.|الكلام صحيح لأن الصديق الحقيقي يجب أن يوافق.|لا يمكن معرفة الأسلوب المستخدم دون معرفة النية الحقيقية.','C',[1,0,4,0,2]],
['R','عند اكتشاف أن معلومة سابقة كانت خاطئة، وأن جزءًا من القرار بُني على تلك المعلومة. شنو أقرب تصرف؟','مراجعة القرار وتحديد الأجزاء التي تأثرت بالمعلومة الخاطئة.|إذا كانت النتيجة جيدة، فلا توجد حاجة لمراجعة القرار.|اعتبار القرار كله خاطئًا بالضرورة.|التمسك بالقرار إلى أن يثبت أن نتيجته النهائية خاطئة.|تجاهل المعلومة القديمة والتركيز على النتيجة فقط.','A',[4,1,0,2,1]],
['U','شخص يعطي معلومة، وعندما يُسأل عن مصدرها يقول: «ما أتذكر بالضبط، بس متأكد إنها صحيحة». ولا توجد أي أدلة إضافية تؤكد كلامه. شنو أقرب طريقة للتعامل ويا المعلومة؟','اعتبارها صحيحة لوجود الثقة بها.|اعتبارها خاطئة لعدم تذكر المصدر.|التعامل وياها كمعلومة غير مؤكدة، والفصل بين ثقة الشخص بصحتها وبين وجود دليل عليها.|إذا كانت المعلومة منطقية، فهي غالبًا صحيحة.|عدم القدرة على الاستفادة منها بأي شكل لأنها غير مؤكدة.','C',[1,0,4,2,1]],
['A','شخص يقول: «أنا ما أكره هذا المكان، بس ما أحب أجي له كثير». أي عبارة تنقل كلامه بدقة؟','قال إنه يحب المكان.|قال إنه يكره المكان.|قال إنه لا يكره المكان، لكنه لا يحب زيارته كثيرًا.|واضح أنه يكره المكان لكنه لا يريد الاعتراف بذلك.|لا يمكن معرفة أي شيء عن موقفه تجاه المكان.','C',[1,0,4,1,1]],
['L','عند وجود ثلاثة تفسيرات محتملة لحدث معين، لكن المعلومات المتوفرة لا تكفي لتحديد تفسير واحد بشكل قاطع، ثم ظهرت معلومة جديدة تجعل أحد التفسيرات أكثر احتمالًا، لكنها لا تستبعد التفسيرين الآخرين. شنو أقرب تصرف؟','الميل إلى التفسير الذي تدعمه المعلومة الجديدة، مع إبقاء التفسيرات الأخرى ممكنة.|اختيار التفسير المدعوم واستبعاد التفسيرين الآخرين.|إبقاء التفسيرات الثلاثة بالاحتمال نفسه لأن اليقين غير متوفر.|رفض المعلومة الجديدة لأنها لا تثبت التفسير بشكل قاطع.|تأجيل أي ترجيح حتى تظهر معلومات إضافية.','A',[4,1,2,0,3]],
['U','عند وجود تفسيران محتملان لحدث معين، لكن المعلومات المتوفرة لا تكفي لمعرفة أيهما أرجح. شنو أقرب طريقة للتعامل وياهما؟','اختيار التفسير الذي يبدو أكثر منطقية.|إبقاء التفسيرين مفتوحين إلى أن تظهر معلومة تساعد على التمييز بينهما.|الميل إلى التفسير الذي يحدث عادةً في الحالات المشابهة.|اختيار أحدهما مؤقتًا والبناء عليه استنتاجات.|افتراض أن التفسيرين متساويان تمامًا في الاحتمال.','B',[2,4,2,0,1]],
['D','عند مناقشة شخص يرفض فكرة معينة بسبب تجربة سابقة مرّ بها، ويعتمد على تلك التجربة في تكوين موقفه. شنو أقرب تصرف؟','توضيح أن التجربة لا تمثل بالضرورة جميع الحالات، ومناقشة حدود الاستنتاج منها.|رفض التجربة لأنها تجربة شخصية وليست دليلًا.|تكرار الأدلة التي تدعم الرأي حتى يقتنع بأن الحجة أقوى.|تغيير الموضوع لأن التجارب الشخصية لا يمكن مناقشتها.|البحث عن تجربة مشابهة واستخدامها لإثبات أن التجربة الأخرى خاطئة.','A',[4,1,2,0,1]],
['K','شخص يقول: «إذا ما وافقت على كلامي، فأنت أصلًا ما تفهم الموضوع». شنو الأسلوب المستخدم؟','تقديم دليل يثبت أن الكلام صحيح.|ربط فهم الموضوع بالموافقة على الرأي، وكأن الاختلاف دليل على عدم الفهم.|الاعتراف بأن الموضوع يحتمل أكثر من تفسير.|إثبات أن الطرف الآخر لم يفهم المعلومات فعلًا.|طلب توضيح أسباب الاختلاف.','B',[0,4,1,1,2]],
['K','شخص يقول: «لا تفكر بالموضوع هواي، إذا تردد هسه راح تندم لأن الفرصة ما راح ترجع». شنو أقرب تحليل لهذا الكلام؟','قد يُستخدم عامل الاستعجال لتقليل وقت التفكير ودفع الطرف الآخر إلى اتخاذ قرار سريع.|الكلام منطقي بالضرورة لأن الفرص المؤقتة تحتاج قرارًا سريعًا.|يجب رفض العرض لأن كل استعجال يُعد تلاعبًا.|إذا حدث تردد، فهذا يعني أن القرار خاطئ غالبًا.|لا يمكن تحليل أسلوب الكلام دون معرفة نية الشخص بصورة مؤكدة.','A',[4,1,1,0,2]],
['T','عند وجود خطة لتحقيق هدف معين، لكن نجاحها يعتمد على تنفيذ جميع خطواتها كما هو متوقع، ثم ظهرت معلومة جديدة تشير إلى أن فشل إحدى الخطوات الأساسية قد يؤدي إلى مشكلة كبيرة. قبل البدء، شنو الأهم؟','التأكد من أن الخطة تحقق أفضل نتيجة إذا سارت جميع الخطوات كما هو متوقع.|تحديد ما يمكن أن يحدث إذا فشلت إحدى الخطوات الأساسية، ومدى تأثير ذلك على الخطة.|الاستمرار بالخطة لأن تغييرها بعد إعدادها قد يضيع الوقت.|التحقق مما إذا كانت الخطة قد استُخدمت سابقًا بنجاح.|البدء بالخطة والتعامل مع المشكلات عند ظهورها.','B',[2,4,0,2,1]],
['A','شخص يقول: «شفت أحمد أمس بالمكتبة». فيستنتج شخص آخر: «إذن أحمد كان يدرس استعدادًا للامتحان». شنو الخطأ في الاستنتاج؟','استنتج غرضًا أو سببًا للوجود في المكتبة لم يذكره الكلام الأصلي.|نقل المعلومة الأصلية كما هي دون تغيير.|شكك بصحة مشاهدة أحمد.|أضاف سببًا غير موجود في المعلومة الأصلية.|غيّر زمن الجملة من الماضي إلى الحاضر.','D',[3,1,1,4,0]],
['T','عند وجود هدف يمكن الوصول إليه بطريقتين: الطريق الأول أسرع لكنه يعتمد على شرط قد يتغير، والطريق الثاني أبطأ لكنه يبقى متاحًا حتى إذا تغير ذلك الشرط. شنو أقرب طريقة لاتخاذ القرار؟','اختيار الطريق الأول لأنه الأسرع.|اختيار الطريق الثاني لأنه الأكثر أمانًا دائمًا.|مقارنة فائدة السرعة باحتمال تغيّر الشرط وتأثير ذلك على الوصول إلى الهدف.|البدء بالطريق الأول والانتقال إلى الثاني إذا تغير الشرط.|الانتظار حتى يُعرف بصورة مؤكدة ما إذا كان الشرط سيتغير.','C',[1,1,4,3,0]],
['R','أثناء مناقشة موضوع معين، اكتُشف أن جزءًا من الحجة مبني على معلومة خاطئة، لكن هذا الخطأ لا يعني بالضرورة أن النتيجة النهائية خاطئة. شنو أقرب تصرف؟','تجاهل الخطأ إذا كانت النتيجة تبدو صحيحة.|مراجعة الجزء الخاطئ والتحقق مما إذا كانت النتيجة لا تزال مدعومة بالأدلة الأخرى.|التمسك بالنتيجة لأن الخطأ لا يغيّرها بالضرورة.|تغيير النتيجة فورًا حتى لا يتكرر الخطأ.|إنهاء النقاش لأن اكتشاف الخطأ يعني أن الحجة فقدت قيمتها بالكامل.','B',[0,4,2,1,0]],
['P','شخص يشرح موضوعًا، وعندما يلاحظ أن الطرف الآخر لم يفهم نقطة معينة، يغيّر طريقة الشرح بدلًا من تكرار الكلمات نفسها. شنو أقرب استنتاج؟','محاولة جعل الفكرة مفهومة للطرف الآخر من خلال تكييف طريقة الشرح.|محاولة إثبات المعرفة أكثر من الطرف الآخر.|عدم الثقة بالقدرة على الشرح.|تغيير الكلمات حتى يُتجنب الاعتراض على الكلام.|تغير الأسلوب حسب المزاج فقط.','A',[4,0,1,1,1]],
['S','شخص كان يعتقد أنه يتخذ قراراته بهدوء، لكنه لاحظ عبر عدة مواقف أن الاستعجال يظهر عنده بصورة متكررة عندما يكون القرار مهمًا بالنسبة إليه. شنو أدق استنتاج؟','الهدوء السابق كان مجرد وهم.|أهمية القرار قد تؤثر على طريقة التصرف، وهذا جانب جديد يحتاج إلى أخذه بالحسبان عند فهم النفس.|القرارات المهمة تكشف الشخصية الحقيقية دائمًا.|الاستعجال يعني عدم معرفة كيفية اتخاذ القرارات.|عدم القدرة على تكوين أي استنتاج اعتمادًا على هذه المواقف.','B',[1,4,1,0,1]],
['L','لوحظ أن الحدث (A) يتكرر وبعده يحدث الحدث (B) في عدة مناسبات، لكن لا توجد معلومات تؤكد وجود علاقة سببية أو ارتباط فعلي بينهما. شنو أقرب تصرف؟','اعتبار وجود علاقة بين الحدثين أمرًا مرجحًا إلى أن يثبت العكس.|اعتبار التكرار وحده دليلًا كافيًا على وجود علاقة.|البحث عن عوامل أخرى قد تفسر حدوث الحدثين معًا، وفحص الأدلة قبل تحديد طبيعة العلاقة.|رفض احتمال وجود أي علاقة لأن التزامن لا يثبت السببية.|اعتبار أحد الحدثين سببًا للآخر إذا كان يسبقه زمنيًا.','C',[2,0,4,2,1]],
['K','شخص يقول: «أنا بس أريد مصلحتك، ولهذا إذا ما سويت اللي أگوله فأنت قاعد تضر نفسك». شنو أدق تحليل لهذا الكلام؟','النصيحة صحيحة بالضرورة لأن الشخص يقول إن نيته المساعدة.|قد تكون النصيحة مفيدة فعلًا، لكن صياغتها تضغط حتى يُقبل الرأي.|هذا تلاعب مؤكد لمجرد استخدام عبارة «مصلحتك».|إذا كان الشخص يعرف أكثر، فمن الطبيعي اتباع كلامه دون مناقشة.|لا يمكن تقييم طريقة الكلام إلا بعد معرفة النتيجة النهائية.','B',[1,4,1,0,2]],
['U','وصلت معلومتان متعارضتان من مصدرين مختلفين، ولا تملك الجهة المتلقية حاليًا طريقة للتحقق من أيهما أدق. شنو أقرب طريقة للتعامل وياهما؟','اختيار المعلومة التي تبدو أكثر منطقية.|التعامل مع المعلومتين كاحتمالين غير محسومين إلى أن تظهر أدلة تميز بينهما.|الثقة بالمصدر المعروف أكثر دون فحص المعلومات نفسها.|رفض المعلومتين لمجرد وجود تعارض بينهما.|اختيار المعلومة التي تتفق مع التوقعات السابقة.','B',[2,4,2,1,0]],
['D','أثناء نقاش، لوحظ أن اعتراض الطرف الآخر على الحجة ناتج عن فهم مختلف لكلمة أساسية استُخدمت. شنو أقرب تصرف؟','توضيح المقصود بالكلمة، ثم متابعة النقاش بناءً على المعنى المشترك.|اعتبار الاعتراض دليلًا على ضعف الحجة.|تكرار الحجة نفسها حتى ينتبه الطرف الآخر لسوء الفهم.|ترك النقاش لأن اختلاف معنى كلمة واحدة يجعل الاتفاق مستحيلًا.|تغيير معنى الكلمة وتغيير الموقف بناءً على ذلك مباشرة.','A',[4,1,2,0,1]],
['A','شخص يقول: «أنا ما قلت إن القرار كان غلط، قلت إن الطريقة اللي وصلنا بيها للقرار كانت ضعيفة». أي عبارة تنقل كلامه بدقة؟','رفض القرار نفسه واعتبره خاطئًا.|انتقد طريقة الوصول إلى القرار، دون أن يعني ذلك بالضرورة رفض القرار نفسه.|قال إن القرار والطريقة التي اتُّبعت كلاهما خاطئان.|غيّر رأيه بشأن القرار.|لم يوضح رأيه بشأن طريقة اتخاذ القرار.','B',[0,4,1,1,1]],
['L','عند وجود تفسيرين لحدث معين؛ الأول يشرح معظم التفاصيل لكنه يترك نقطة واحدة دون تفسير، والثاني يشرح تلك النقطة لكنه لا يفسر بعض التفاصيل الأخرى. شنو أقرب طريقة للتعامل مع التفسيرين؟','اختيار الأول لأنه يفسر أكبر عدد من التفاصيل.|اختيار الثاني لأنه يفسر النقطة التي عجز الأول عن تفسيرها.|مقارنة ما يفسره كل تفسير وما يعجز عن تفسيره، والبحث عن معلومات إضافية تساعد على الترجيح.|اعتبار التفسيرين متساويين لأن كليهما يحتوي على نقص.|دمج التفسيرين مباشرة واعتبارهما تفسيرًا واحدًا صحيحًا.','C',[2,1,4,1,1]],
['R','عند وجود تفسير قديم لحدث معين لم يكن يشرح جميع التفاصيل، وبعد البحث ظهر تفسير جديد يشرح بعض الأحداث بصورة أفضل. شنو أقرب تصرف؟','الانتقال إلى التفسير الجديد مباشرة لمجرد أنه أحدث.|التمسك بالتفسير القديم لأنه كان مبنيًا على المعلومات المتوفرة وقتها.|مقارنة التفسيرين وتحديد أيهما مدعوم بالأدلة بصورة أفضل.|اعتبار التفسيرين صحيحين بالدرجة نفسها.|تجاهل التفسير الجديد إذا لم يغيّر النتيجة النهائية.','C',[1,1,4,1,0]],
['P','شخص يتصرف بطريقة مختلفة جدًا مع شخص معيّن مقارنةً بطريقة تعامله مع بقية الناس. شنو أقرب استنتاج من هذا الاختلاف؟','لديه مشاعر مختلفة تجاه هذا الشخص بالتأكيد.|توجد بينهما مشكلة سابقة بالتأكيد.|الاختلاف يوحي بأن العلاقة أو السياق مختلف، لكن السبب المحدد يحتاج إلى معلومات إضافية.|الشخص الآخر يسبب له التوتر غالبًا.|لا يمكن استنتاج أي شيء إطلاقًا من اختلاف السلوك.','C',[1,1,4,2,0]],
['L','لدينا المعلومات التالية: «كل الطلاب الذين حضروا الاجتماع استلموا الملف». «سارة استلمت الملف». أي استنتاج لا يمكن إثباته بالضرورة من المعلومات السابقة؟','سارة حضرت الاجتماع.|من الممكن أن تكون سارة قد حضرت الاجتماع.|لا يمكننا تحديد ما إذا كانت سارة قد حضرت الاجتماع اعتمادًا على هذه المعلومات وحدها.|سارة لم تحضر الاجتماع.|من الممكن أن تكون سارة قد استلمت الملف بطريقة أخرى.','A',[4,2,3,0,2]],
['I','شخص يتحدث عن مشكلة، ثم يقول لصديقه: «أكو ناس جرّبوا حل معيّن، وبعد فترة اكتشفوا أن وضعهم صار أسهل»، وبعدها يغيّر الموضوع دون أن يقترح عليه تجربة الحل نفسه. شنو الوصف الأدق لوظيفة هذا الكلام؟','نقل تجربة سابقة دون وجود أي محاولة للتأثير.|طرح فكرة بصورة غير مباشرة قد تدفع الطرف الآخر إلى التفكير فيها.|إقناع مباشر باستخدام صياغة ألطف.|تلاعب بالضرورة لأن التأثير غير المباشر مقصود.|لا يمكن تحديد وظيفة الكلام دون معرفة النتيجة التي حدثت لاحقًا.','B',[1,4,1,0,2]],
['E','عند وجود مهمة متكررة ومملة، لكنها ضرورية حتى تكتمل مهمة أكبر. شنو أقرب طريقة للتعامل وياها؟','العمل عليها لفترة، ثم تغيير النشاط والرجوع إليها لاحقًا.|إكمالها كلها دفعة واحدة حتى التخلص منها.|تركها إذا تعذر الحفاظ على الاهتمام بها.|تأجيلها إلى أن تعود الرغبة.|الاستمرار بنفس الوتيرة مهما طال الوقت، دون تغيير الأسلوب.','A',[4,2,0,1,2]],
['L','عند وجود تفسيرين محتملين لحدث معيّن، وبعد البحث وجمع الأدلة اتضح أن كل تفسير يشرح جزءًا مختلفًا من الأحداث، لكن لا يستطيع أي منهما وحده تفسير جميع التفاصيل. شنو أقرب تصرف؟','اختيار التفسير الذي يشرح العدد الأكبر من التفاصيل.|البحث عن تفسير ثالث قد يستطيع الجمع بين الأدلة التي يشرحها التفسيران.|التمسك بالتفسير الذي فُكر به أولًا.|اختيار التفسير الأبسط دون النظر إلى الأدلة التي لا يفسرها.|ترك الموضوع لأن اختلاف الأدلة يعني استحالة الوصول إلى تفسير مناسب.','B',[2,4,0,1,0]],
['P','شخص عادةً يجيب عن الأسئلة بسرعة، لكنه عندما يُطرح عليه موضوع معيّن، يصبح أبطأ في الرد ويختار كلماته بعناية أكبر. اعتمادًا على التغيّر السلوكي وحده، شنو أقرب استنتاج؟','قد يتطلب الموضوع منه تفكيرًا أو معالجة أكبر من المعتاد.|الموضوع مهم بالنسبة إليه بالتأكيد.|أصبح غير مهتم بالشخص الذي يتحدث معه.|يخفي سببًا معينًا بالتأكيد.|الموضوع يسبب له القلق بالضرورة.','A',[4,1,0,1,1]],
['L','شخص يقول: «إذا كان الجهاز معطّلًا، فلن يعمل. الجهاز لم يعمل، إذن هو معطّل». شنو المشكلة المنطقية في استنتاجه؟','افتراض أن عدم عمل الجهاز لا يمكن أن يكون له سبب آخر غير تعطّله.|النتيجة صحيحة بالضرورة لأن الجهاز لم يعمل.|تجاهل أن الأجهزة قد تعمل أحيانًا دون كهرباء.|استخدام معلومة لا علاقة لها بالنتيجة.|الخطأ هو استخدام كلمة «إذن».','A',[4,0,1,1,0]],
['K','شخص يقول: «كل الناس اللي يعترضون على فكرتي ما فهموها أصلًا، لذلك اعتراضهم ما ينحسب». شنو المشكلة الأوضح في طريقة تفكيره؟','افتراض أن سبب كل اعتراض هو سوء الفهم، دون فحص الاعتراضات نفسها.|قد يكون كلامه صحيحًا بالضرورة إذا كانت فكرته معقدة.|الاعتراف بأن فكرته تحتمل أكثر من تفسير.|طلب توضيح أسباب الاختلاف من المعترضين.|إثبات أن فكرته صحيحة بمجرد رفض الاعتراضات.','A',[4,1,1,2,0]],
['R','عند الاقتناع بتفسير معيّن لموقف، وبعد فترة ظهر دليل جديد يناقض جزءًا من التفسير، لكنه لا يناقض جميع أجزائه. شنو أقرب تصرف؟','ترك التفسير كله لأن جزءًا منه ظهر أنه غير صحيح.|تعديل الجزء المتعارض، ثم فحص ما إذا كانت بقية أجزاء التفسير ما زالت مدعومة بالأدلة.|التمسك بالتفسير كما هو لأن الدليل الجديد لم يهدمه بالكامل.|اعتبار الدليل الجديد أهم من جميع الأدلة السابقة دون مقارنة.|تأجيل الحكم على التفسيرين إلى أن يختفي التعارض تمامًا.','B',[0,4,2,1,2]],
['A','شخص يقول: «أنا قلت إن بعض الطلاب ما حضروا، مو قلت إنهم كلهم ما حضروا». فيرد شخص آخر: «يعني أنت تقول إن الطلاب ما حضروا». شنو الخطأ في الرد؟','تعميم الكلام أكثر من معناه الأصلي، وتحويل الحديث عن بعض الطلاب إلى تعميم أوسع.|تغيير زمن الجملة.|التشكيك بصحة الكلام الأصلي.|تكرار المعنى نفسه بصياغة مختلفة دون تغيير.|حذف كلمة من الكلام دون تغيير معناه.','A',[4,0,1,1,1]],
['F','عند وضع خطة لتحقيق هدف معيّن وبدء تنفيذها، ظهرت بعد فترة ظروف جديدة جعلت الطريقة المختارة أقل فاعلية، لكن الهدف نفسه ما زال ممكن التحقيق. شنو أقرب تصرف؟','الاستمرار بالخطة الأصلية لأن تغييرها يعني أن التخطيط الأول كان خاطئًا.|التخلي عن الهدف لأن الظروف لم تعد مثلما توقعت.|مراجعة الخطة وتعديل الوسائل بما يتناسب مع الظروف الجديدة، مع الحفاظ على الهدف إذا بقي قابلًا للتحقيق.|اختيار أي طريقة بديلة بسرعة حتى لا يتوقف العمل.|الانتظار حتى تعود الظروف السابقة، ثم استئناف الخطة نفسها.','C',[1,0,4,2,1]]
];
const intros=[['ما هو الاختبار؟','اختبار تفاعلي مصمم لقياس مجموعة من القدرات العقلية والسلوكية، من خلال أسئلة ذكية ومواقف واقعية.'],['ما الذي يقيسه؟','يقيس مهاراتك في التحليل، المنطق، فهم الناس، الدقة المعرفية، التفكير الاستراتيجي، والمزيد.'],['ما هدفه؟','مساعدتك على فهم نفسك بعمق أكبر واكتشاف نقاط قوتك وتطويرها.']];let introIndex=0,index=0,answers=JSON.parse(localStorage.getItem('hadwiAnswers')||'{}'),scores=[];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='quiz')renderQuestion();}
function renderIntro(){document.getElementById('introCount').textContent=(introIndex+1)+'/3';document.getElementById('introContent').innerHTML='<h2>'+intros[introIndex][0]+'</h2><p>'+intros[introIndex][1]+'</p>';document.getElementById('introDots').textContent=['●','○','○'].map((x,i)=>i===introIndex?'●':'○').join(' ');document.getElementById('introNext').textContent=introIndex===2?'فهمت. لنبدأ!':'التالي';}function nextIntro(){if(introIndex<2){introIndex++;renderIntro()}else show('quiz')}document.getElementById('intro').addEventListener('transitionend',()=>{});document.querySelector('#home .start').addEventListener('click',()=>{introIndex=0;index=0;answers={};localStorage.removeItem('hadwiAnswers');renderIntro()});
function renderQuestion(){let q=Q[index];document.getElementById('progress').textContent=(index+1)+'/60';document.getElementById('qnum').textContent='السؤال '+(index+1);document.getElementById('question').textContent=q[1];let opts=q[2].split('|');document.getElementById('options').innerHTML=opts.map((o,i)=>`<button class="option ${answers[index]===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCDE'[i]}</span><span>${o}</span>${answers[index]===i?'<b style="margin-right:auto">✓</b>':''}</button>`).join('');}
function choose(i){answers[index]=i;localStorage.setItem('hadwiAnswers',JSON.stringify(answers));if(index<59){index++;renderQuestion()}else{if(Object.keys(answers).length===60){show('analysis');setTimeout(calculate,900)}}}
function previous(){if(index>0){index--;renderQuestion()}else show('intro')}
function calculate(){let sums={},counts={};Object.keys(abilities).forEach(k=>{sums[k]=0;counts[k]=0});Q.forEach((q,i)=>{let k=q[0],a=answers[i],v=q[4][a]??0;sums[k]+=v;counts[k]++});scores=Object.keys(abilities).map(k=>({code:k,name:abilities[k],score:counts[k]?Math.round((sums[k]/(counts[k]*4))*100)/10:0,count:counts[k]}));scores.sort((a,b)=>b.score-a.score||Object.keys(abilities).indexOf(a.code)-Object.keys(abilities).indexOf(b.code));renderResults();show('results')}
function renderResults(){let ordered=Object.keys(abilities).map(k=>scores.find(s=>s.code===k));document.getElementById('bars').innerHTML=ordered.map(s=>`<div><div class="barhead"><b>${s.name}</b><span>${s.score.toFixed(1)}/10</span></div><div class="track"><div class="fill" style="width:${s.score*10}%"></div></div></div>`).join('');document.getElementById('detailsList').innerHTML=ordered.map(s=>`<div class="detail"><div class="barhead"><b>${s.code} — ${s.name}</b><b>${s.score.toFixed(1)}/10</b></div><div class="track"><div class="fill" style="width:${s.score*10}%"></div></div><small>عدد الأسئلة المرتبطة: ${s.count} · الدرجة محسوبة من متوسط أوزان الإجابات.</small></div>`).join('');drawRadar(ordered);let top=scores.slice(0,5);document.getElementById('patternCode').textContent=top.map(s=>s.code+Math.round(s.score)).join('');document.getElementById('patternList').innerHTML=top.map(s=>`<div class="patternitem"><span><b>${s.code}${Math.round(s.score)}</b> — ${s.name}</span><b>${s.score.toFixed(1)}/10</b></div>`).join('');document.getElementById('patternDesc').textContent='يتكوّن نمطك من القدرات الخمس الأعلى في إجاباتك. '+top.map(s=>s.name+' ('+s.code+')').join('، ')+' تمثل الجوانب الأبرز في هذا الاختبار. الدرجات وصفية وليست تشخيصًا نفسيًا أو مقياس ذكاء.'}
function drawRadar(arr){
  const n=12,cx=210,cy=210,r=108,labelR=151,pts=[];
  const lines={
    S:['الوعي الذاتي'],
    P:['فهم الناس','والأنماط'],
    L:['المنطق','والاستدلال'],
    A:['الدقة','المعرفية'],
    E:['الصبر','والتحمّل'],
    D:['المحاورة','والإقناع'],
    I:['زرع الفكرة','بشكل غير','مباشر'],
    K:['كشف','التلاعب'],
    T:['التفكير','الاستراتيجي'],
    R:['التعامل مع','الأخطاء'],
    U:['التعامل مع','المعلومات','الناقصة'],
    F:['المرونة','الفكرية']
  };
  const angle=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let ring=1;ring<=4;ring++){
    const rr=r*ring/4,p=[];
    for(let i=0;i<n;i++){const a=angle(i);p.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}
    pts.push(`<polygon points="${p.join(' ')}" fill="none" stroke="#ddd"/>`);
  }
  const poly=arr.map((s,i)=>{
    const a=angle(i),rr=r*Math.max(0,Math.min(10,Number(s.score)||0))/10;
    return (cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a));
  });
  const axes=Array.from({length:n},(_,i)=>{
    const a=angle(i);
    return `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#ccc"/>`;
  }).join('');
  const labels=arr.map((s,i)=>{
    const a=angle(i),x=cx+labelR*Math.cos(a),y=cy+labelR*Math.sin(a);
    const anchor=Math.cos(a)>.35?'end':Math.cos(a)<-.35?'start':'middle';
    const rows=lines[s.code]||[s.name];
    const start=-(rows.length-1)*6;
    return `<text x="${x.toFixed(1)}" y="${(y+start).toFixed(1)}" text-anchor="${anchor}" direction="rtl" unicode-bidi="plaintext" font-size="11" font-weight="600" fill="#222">${rows.map((t,j)=>`<tspan x="${x.toFixed(1)}" dy="${j===0?0:13}">${t}</tspan>`).join('')}</text>`;
  }).join('');
  document.getElementById('radar').innerHTML=
    `<svg viewBox="0 0 420 420" role="img" aria-label="خريطة القدرات الاثنتي عشرة">${pts.join('')}${axes}<polygon points="${poly.join(' ')}" fill="#111" fill-opacity=".22" stroke="#111" stroke-width="2"/>${poly.map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="#111"/>`;}).join('')}${labels}</svg>`;
}
function shareResult(){let top=scores.slice(0,5),code=top.map(s=>s.code+Math.round(s.score)).join(''),txt='نتيجة Test Hadwi\nالنمط النهائي: '+code+'\n'+top.map(s=>s.code+' — '+s.name+': '+s.score.toFixed(1)+'/10').join('\n');if(navigator.share)navigator.share({title:'Test Hadwi',text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('تم نسخ النتيجة.'));else alert(txt)}
// بدء صفحة التعريف عند الانتقال إليها من زر Start
const startBtn=document.querySelector('#home .start');startBtn.onclick=()=>{introIndex=0;renderIntro();show('intro')};
</script></body></html>
